<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>da_filta · Prototype 0.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
  <main class="console">
    <header class="masthead"><div class="brand">DA <span>FILTA</span></div><label class="theme-picker"><span class="sr-only">UI Theme</span><select data-theme-select aria-label="UI Theme"><option value="current">Current / Cyan Studio</option><option value="clean-modern">Clean Modern</option><option value="dark-studio">Dark Studio</option><option value="analog-inspired">Analog Inspired</option><option value="minimal-dark">Minimal Dark</option><option value="pro-console">Pro Console</option></select></label><button class="dev-lab-toggle active" type="button" data-dev-lab-toggle aria-expanded="true" aria-controls="dev-lab-panel">DEV/LAB</button><div class="layout-note">Desktop Studio Interface</div></header>
    <section class="audio-io-bar" aria-label="Audio Ein- und Ausgabe">
      <div class="audio-input-source"><div class="source-toggle" role="group" aria-label="Audioquelle"><button class="source-toggle-button active" type="button" data-audio-source="device" aria-label="Audio-Eingabegerät verwenden" aria-pressed="true" title="Verwendet ein angeschlossenes Audio-Eingabegerät als Quelle für die Filterbank."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9.5a4 4 0 0 1 0 5M18.5 7a8 8 0 0 1 0 10"/></svg></button><button class="source-toggle-button" type="button" data-audio-source="sample" aria-label="Integrierte Samples verwenden" aria-pressed="false" title="Verwendet integrierte Audio-Loops aus dem Projekt als reproduzierbare Testquelle für die Filterbank."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h2l2-5 3 10 3-14 3 18 2-9h3"/><path d="M18 4v3h-3"/></svg></button></div><label class="audio-device"><span>INPUT</span><select data-audio-input aria-label="Audio-Eingabegerät"><option value="">Geräte werden geladen …</option></select></label></div>
      <label class="audio-device"><span>OUTPUT</span><select data-audio-output aria-label="Audio-Ausgabegerät"><option value="">Geräte werden geladen …</option></select></label>
      <div class="audio-actions"><button type="button" class="audio-button start" data-audio-start>START AUDIO</button><button type="button" class="audio-button stop" data-audio-stop disabled>STOP AUDIO</button></div><button type="button" class="audio-button panic" data-audio-panic>PANIC</button>
      <div class="audio-state" aria-live="polite"><span>AUDIO STATUS</span><strong data-audio-status>OFF</strong><small data-audio-message></small></div>
    </section>
    <section class="global-controls" aria-label="Globale Bedienelemente">
      <label class="control-card"><span class="control-label">INPUT GAIN</span><span class="control-row"><span class="range-hit-area"><input type="range" min="0" max="24" value="0" data-control="inputGain" aria-label="Input Gain"></span><output data-output="inputGain">0.0 dB</output></span><span class="control-scale"><span>0</span><span>+24</span></span></label>
      <label class="control-card"><span class="control-label">RESONANCE</span><span class="control-row"><span class="range-hit-area"><input type="range" min="-1" max="1" step="0.01" value="0" data-control="resonance" aria-label="Resonance"></span><output data-output="resonance">0</output></span><span class="control-scale"><span>-1</span><span>0</span><span>+1</span></span></label>
      <label class="control-card"><span class="control-label">DRY / WET</span><span class="control-row"><span class="range-hit-area"><input type="range" min="0" max="100" value="50" data-control="dryWet" aria-label="Dry / Wet"></span><output data-output="dryWet">50 %</output></span><span class="control-scale"><span>0</span><span>100</span></span></label>
      <label class="control-card"><span class="control-label">SPREAD</span><span class="control-row"><span class="range-hit-area"><input type="range" min="-1" max="1" step="0.01" value="0" data-control="spread" aria-label="Spread"></span><output data-output="spread">0</output></span><span class="control-scale"><span>-1</span><span>0</span><span>+1</span></span></label>
      <label class="control-card"><span class="control-label">VOLUME</span><span class="control-row"><span class="range-hit-area"><input type="range" min="-60" max="0" value="-6" data-control="volume" aria-label="Volume"></span><output data-output="volume">-6.0 dB</output></span><span class="control-scale"><span>-60</span><span>0</span></span></label>
    </section>
    <section class="fb-workspace" aria-label="FB Workspace"><div class="analyzer" aria-label="Statische Pegelübersicht"><div class="analyzer-header"><strong>FILTERBANK RESPONSE</strong><div class="analyzer-header-controls"><div class="dev-lab-controls" aria-label="DEV LAB Resonance"><b>DEV/LAB</b><label class="dev-audition-control"><span>DEV RES AUD</span><select data-positive-resonance-audition aria-label="DEV Resonance Audition"><option value="0.10">0.10</option><option value="0.20">0.20</option><option value="0.30">0.30</option><option value="0.40">0.40</option><option value="0.60">0.60</option><option value="0.80">0.80</option><option value="1.00">1.00</option></select></label><label class="dev-audition-control"><span>DEV RES DRIVE</span><select data-positive-resonance-drive aria-label="DEV Resonance Drive"><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="8">8</option><option value="16">16</option></select></label><label class="dev-audition-control"><span>DEV RES FLOOR</span><select data-positive-resonance-damping-floor aria-label="DEV Resonance Floor"><option value="0.10">0.10</option><option value="0.05">0.05</option><option value="0.02">0.02</option><option value="0.00">0.00</option><option value="-0.02">-0.02</option></select></label><label class="dev-lab-control dev-lab-control-wide"><span>DEV RES OUTPUT</span><select data-positive-resonance-output aria-label="DEV Resonance Output"><option value="current-residual">CURRENT RESIDUAL</option><option value="nonlinear-base">NONLINEAR - BASE</option><option value="full-nonlinear">FULL NONLINEAR</option></select></label><label class="dev-lab-control"><span>DEV RES LATENCY</span><select data-positive-resonance-latency aria-label="DEV Resonance Latency"><option value="current">CURRENT</option><option value="matched">MATCHED</option></select></label><label class="dev-lab-control"><span>DEV RES CURVE</span><select data-positive-resonance-curve aria-label="DEV Resonance Curve"><option value="current">CURRENT</option><option value="early">EARLY</option><option value="aggressive">AGGRESSIVE</option></select></label></div><label class="fb-all-control"><span>FB ALL</span><button class="fb-all-toggle" type="button" aria-label="FB All Platzhalter">OFF</button></label></div></div><div class="analyzer-status"><span>MODE <b>FB</b></span><span>SCREEN <b>PERFORMANCE</b></span><span>CHANNEL <b>L + R (linked)</b></span><span>SPREAD MODE <b>CLASSIC</b></span></div><div class="chart-grid"><div class="axis-y"><span>+</span><span>0</span><span>−</span></div><div class="bars"></div><div class="axis-x"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div><div class="legend"><span><i></i>L</span><span><i></i>R</span></div></div></section>
    <section class="bands" aria-label="Frequenzbänder"></section>
    <aside class="dev-lab-panel" id="dev-lab-panel" data-dev-lab-panel aria-label="DEV / LAB Panel">
    <div class="dev-lab-panel-header"><strong>DEV / LAB</strong><span>Experimental controls</span></div>
    <div class="dev-lab-controls" aria-label="DEV LAB Controls"></div>
    </aside>
  </main>
  </div>
  <script src="state.js"></script>
  <script src="filterbank.js"></script>
  <script src="audio-engine.js"></script>
  <script src="sample-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
